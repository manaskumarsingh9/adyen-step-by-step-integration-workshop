<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Preauthorisation</title>
</head>
<body>
<main layout:fragment="content">
    <div class="main-container">
        <div class="info">
            <h1>Manage your preauthorisation</h1>
            <p>Preauthorize now, adjust the amount, then capture, cancel or refund.</p>
        </div>

        <div class="order-summary"
             th:attr="data-psp=${preauth != null ? preauth.pspReference() : ''}, data-status=${preauth != null ? preauth.status() : ''}, data-amount=${preauth != null ? preauth.amountValue() : ''}, data-event-sequence=${eventSequence}">
            <p th:if="${preauth}">
                pspReference: <span th:text="${preauth.pspReference()}"></span><br/>
                reference: <span th:text="${preauth.reference()}"></span><br/>
                authorised amount: <span th:text="${#numbers.formatDecimal(preauth.amountValue() / 100.0, 1, 2)}"></span> <span th:text="${preauth.currency()}"></span><br/>
                status: <span th:text="${preauth.status()}"></span>
            </p>
            <p th:unless="${preauth}">No preauthorisation yet. Start one from the home page.</p>
        </div>

        <!--
        Buttons are only gated on "does a preauthorisation exist at all", not on its current
        status. README_PREAUTHORISATION.md's checklist deliberately requires attempting sequences
        like capture -> cancel, cancel -> capture, and refund -> capture, so every button needs to
        stay clickable in every state to actually reach Adyen and observe the real
        success/failure webhook (e.g. CAPTURE_FAILED, TECHNICAL_CANCEL, REFUND_FAILED).
        -->
        <div class="cart-footer">
            <input type="number" id="modify-amount-input" class="text-input" step="0.01" min="0"
                   placeholder="New authorised amount (e.g. 66.00)"/>
            <button id="modify-amount-button" class="button" th:disabled="${preauth == null}">Update amount</button>
            <button id="capture-button" class="button" th:disabled="${preauth == null}">Capture</button>
            <button id="cancel-button" class="button" th:disabled="${preauth == null}">Cancel</button>
            <button id="refund-button" class="button" th:disabled="${preauth == null}">Refund</button>
        </div>

        <div class="info">
            <p id="status"></p>
        </div>
    </div>

    <div id="webhook-toast" class="webhook-toast" role="status" aria-live="polite"></div>

    <script type="text/javascript" src="/preauthorisation.js"></script>
</main>
</body>
</html>
